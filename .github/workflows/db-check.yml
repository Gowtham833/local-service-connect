name: Database Migration Check

on:
  push:
    paths: ['migrations/**', 'seeders/**', 'backend/models/**']
  pull_request:
    paths: ['migrations/**', 'seeders/**', 'backend/models/**']

jobs:
  validate-migrations:
    name: Validate Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: serviconnect_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password_temp
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run migrations
        run: npx sequelize-cli db:migrate
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: serviconnect_ci
          DB_USER: postgres
          DB_PASS: ci_password_temp

      - name: Run seeders
        run: npx sequelize-cli db:seed:all
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: serviconnect_ci
          DB_USER: postgres
          DB_PASS: ci_password_temp

      - name: Rollback test (ensure down migrations work)
        run: npx sequelize-cli db:migrate:undo:all
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: serviconnect_ci
          DB_USER: postgres
          DB_PASS: ci_password_temp
