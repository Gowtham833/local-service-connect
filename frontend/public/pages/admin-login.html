<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — ServiConnect</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/shared.css">
<style>
body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:linear-gradient(160deg,#0D1B2A,#162336 60%,#1E2F45); }
.login-card { background:var(--navy-soft); border:1.5px solid rgba(255,255,255,0.08); border-radius:24px; padding:48px 40px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,0.4); animation:modalIn 0.4s ease; }
@keyframes modalIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
.admin-icon { width:64px; height:64px; border-radius:50%; background:rgba(255,92,26,0.12); border:2px solid rgba(255,92,26,0.3); display:flex; align-items:center; justify-content:center; font-size:1.8rem; margin:0 auto 24px; }
.admin-title { font-family:'Syne',sans-serif; font-size:1.6rem; font-weight:800; text-align:center; margin-bottom:8px; }
.admin-sub { text-align:center; font-size:0.85rem; color:var(--text-dim); margin-bottom:32px; }
.form-group { margin-bottom:20px; }
label { display:block; font-size:0.82rem; font-weight:500; color:rgba(255,255,255,0.7); margin-bottom:8px; }
input { width:100%; background:var(--navy-mid); border:1.5px solid rgba(255,255,255,0.08); border-radius:12px; padding:14px 18px; font-family:'DM Sans',sans-serif; font-size:0.95rem; color:#fff; outline:none; transition:border-color 0.2s; }
input:focus { border-color:var(--orange); box-shadow:0 0 0 3px rgba(255,92,26,0.1); }
.submit-btn { width:100%; background:var(--orange); color:#fff; border:none; border-radius:14px; padding:16px; font-family:'Syne',sans-serif; font-size:1rem; font-weight:700; cursor:pointer; transition:all 0.25s; }
.submit-btn:hover:not(:disabled) { background:var(--orange-light); transform:translateY(-2px); }
.submit-btn:disabled { opacity:0.6; cursor:not-allowed; }
.error-msg { background:rgba(244,67,54,0.1); border:1px solid rgba(244,67,54,0.3); color:#F44336; padding:10px 14px; border-radius:10px; font-size:0.85rem; margin-bottom:16px; display:none; }
.back-link { display:block; text-align:center; margin-top:20px; font-size:0.85rem; color:var(--text-dim); text-decoration:none; }
.back-link:hover { color:var(--orange); }
</style>
</head>
<body>
<div class="login-card">
  <div class="admin-icon">🛡️</div>
  <div class="admin-title">Admin Portal</div>
  <div class="admin-sub">ServiConnect Platform Administration</div>
  <div id="adminError" class="error-msg"></div>
  <div class="form-group"><label>Username</label><input type="text" id="adminUser" placeholder="admin"></div>
  <div class="form-group"><label>Password</label><input type="password" id="adminPass" placeholder="••••••"></div>
  <button class="submit-btn" id="adminBtn" onclick="doAdminLogin()">Login as Admin →</button>
  <p style="font-size:0.75rem;color:var(--text-dim);text-align:center;margin-top:12px">Default: <strong style="color:#fff">admin</strong> / <strong style="color:#fff">admin123</strong></p>
  <a href="/index.html" class="back-link">← Back to home</a>
</div>
<script src="/js/config.js?v=2"></script>
<script src="/js/api.js"></script>
<script>
if (Auth.isLoggedIn() && Auth.getRole()==='admin') window.location.href='/pages/admin-dashboard.html';
function showError(msg) { const el=document.getElementById('adminError'); el.textContent=msg; el.style.display=msg?'block':'none'; }
async function doAdminLogin() {
  const u=document.getElementById('adminUser').value.trim();
  const p=document.getElementById('adminPass').value;
  if(!u||!p){showError('Enter username and password.');return;}
  const btn=document.getElementById('adminBtn');btn.disabled=true;btn.textContent='Logging in…';
  const{ok,data}=await AuthAPI.adminLogin(u,p);
  btn.disabled=false;btn.textContent='Login as Admin →';
  if(ok){Auth.save(data.token,data.role,data.user);window.location.href='/pages/admin-dashboard.html';}
  else showError(data.message||'Login failed.');
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doAdminLogin();});
</script>
</body>
</html>
