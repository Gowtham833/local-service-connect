AWSTemplateFormatVersion: '2010-09-09'
Description: 'Secrets Manager Resources for ServiConnect'

Parameters:
  NamePrefix:
    Type: String
    Description: Prefix for resource names
  DbUsername:
    Type: String
    Description: Database master username
    Default: 'serviconnect_admin'
  DbName:
    Type: String
    Description: Database name
    Default: 'serviconnect'

Resources:
  DbCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub
        - '${NamePrefix}/db-credentials-${StackSuffix}'
        - StackSuffix: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
      Description: RDS PostgreSQL credentials
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${DbUsername}", "dbname": "${DbName}"}'
        GenerateStringKey: 'password'
        PasswordLength: 24
        ExcludeCharacters: '"@/\\'

  AppSecretsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub
        - '${NamePrefix}/app-secrets-${StackSuffix}'
        - StackSuffix: !Select [4, !Split ['-', !Select [2, !Split ['/', !Ref AWS::StackId]]]]
      Description: Application secrets (JWT, etc.)
      GenerateSecretString:
        SecretStringTemplate: '{"jwt_expire": "7d"}'
        GenerateStringKey: 'jwt_secret'
        PasswordLength: 64
        ExcludePunctuation: true

Outputs:
  DbSecretArn:
    Description: ARN of the Database Credentials Secret
    Value: !Ref DbCredentialsSecret
  AppSecretArn:
    Description: ARN of the App Secrets
    Value: !Ref AppSecretsSecret
